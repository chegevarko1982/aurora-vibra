[package]
name = "aurora_vibra"
version = "4.1.0"
edition = "2024"
# edition 2024 требует 1.85, let-chains в src/updater.rs — 1.88.
rust-version = "1.88"
build = "src/build.rs"
default-run = "aurora-vibra"  # Оставляем основное приложение
description = "Tactile feedback (force feedback / rumble) and telemetry utility for Microsoft Flight Simulator"
authors = ["chegevarko1982"]
repository = "https://github.com/chegevarko1982/aurora-vibra"
license = "MIT"
readme = "README.md"
# Бинари из src/bin/ перечислены явно ниже (все под фичей dev-tools) —
# автообнаружение подцепило бы их без required-features.
autobins = false

# lib/SimConnect.dll — проприетарный компонент Microsoft (см. THIRD-PARTY-NOTICES.md),
# его не должно быть в публикуемом архиве крейта. TXT/ — устаревшие копии исходников.
exclude = ["lib/", "TXT/", "dist/"]

[lib]
name = "aurora_vibra"
path = "src/lib.rs"

[[bin]]
name = "aurora-vibra"
path = "src/main.rs"
required-features = ["app"]

# Диагностические утилиты из src/bin/: ручные стенды для железа (перебор
# режимов вибромоторов, замеры HID-фреймов, пробы SimConnect). В релиз не
# входят и в CI не нужны, поэтому спрятаны за отдельной фичей — иначе
# `cargo build --release --features app` собирал бы их все, включая
# test_motor_gui на eframe (~7 МБ).
#
#     cargo run --features dev-tools --bin test_motor_gui
[[bin]]
name = "engine_start_probe"
path = "src/bin/engine_start_probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "ramp_test"
path = "src/bin/ramp_test.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_gear"
path = "src/bin/test_gear.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_hold"
path = "src/bin/test_hold.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_motor_gui"
path = "src/bin/test_motor_gui.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_spoilers"
path = "src/bin/test_spoilers.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_throttle_stutter"
path = "src/bin/test_throttle_stutter.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_throttle_stutter_gui"
path = "src/bin/test_throttle_stutter_gui.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_touchdown"
path = "src/bin/test_touchdown.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_vibro"
path = "src/bin/test_vibro.rs"
required-features = ["dev-tools"]

[[bin]]
name = "test_vibroTH"
path = "src/bin/test_vibroTH.rs"
required-features = ["dev-tools"]

[features]
default = []
app = []
# Ручные диагностические стенды из src/bin/ — см. секции [[bin]] выше.
dev-tools = []

[dependencies]
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = "0.4"
# Не в cfg(windows): settings.rs / types.rs / i18n.rs / aircraft_profiles.rs —
# кроссплатформенные модули, и они сериализуются. Пока serde жил в
# Windows-секции, `cargo check` на Linux падал с unresolved import.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
# GUI
# default-features pulls in the "wgpu" renderer, whose DX12 backend (wgpu-hal)
# depends on windows-core 0.62.x — conflicting with our own `windows = "0.56"`
# pin used throughout hid/sim/tray (two incompatible copies of the same trait
# in the dependency graph). We don't use accesskit/persistence, so stick to
# the glow (OpenGL) renderer instead, sidestepping the conflict entirely.
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["image"] }

# HID
hidapi = "2.6"

# DLL loader for SimConnect
libloading = "0.8"

# utils
anyhow = "1.0"
thiserror = "1.0"
# default-features = false обязательно: с дефолтными фичами reqwest тянет ещё и
# default-tls (native-tls → hyper-tls → schannel) поверх запрошенного rustls,
# то есть два TLS-стека в бинаре вместо одного.
#
# 0.12, а не 0.11: 0.11 тянет rustls 0.21 → rustls-webpki 0.101.7, на которую
# висят RUSTSEC-2026-0098/-0099 (name constraints принимались там, где не
# должны) и -0104 (паника при разборе CRL), плюс неподдерживаемый
# rustls-pemfile 1.x. Через этот стек ходит апдейтер, поэтому держим свежий.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# Проверка SHA-256 скачанного обновления против опубликованного SHA256SUMS.txt
# (см. src/updater.rs) — этот путь кода при необходимости поднимает права
# через UAC, так что архив обязан быть проверен до распаковки.
sha2 = "0.10"

# Win32 API
once_cell = "1.19"
widestring = "1.0"
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_Threading"
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.4"

[dev-dependencies]
mockall = "0.13"
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
