[package]
name = "aurora_vibra"
version = "4.0.1"
edition = "2024"
build = "src/build.rs"
default-run = "aurora-vibra"  # Оставляем основное приложение
description = "Tactile feedback (force feedback / rumble) and telemetry utility for Microsoft Flight Simulator"
authors = ["chegevarko1982"]
repository = "https://github.com/chegevarko1982/Aurora_Vibra"
license = "MIT"
readme = "README.md"

# lib/SimConnect.dll — проприетарный компонент Microsoft (см. THIRD-PARTY-NOTICES.md),
# его не должно быть в публикуемом архиве крейта. TXT/ — устаревшие копии исходников.
exclude = ["lib/", "TXT/", "dist/"]

[lib]
name = "aurora_vibra"
path = "src/lib.rs"

[[bin]]
name = "aurora-vibra"
path = "src/main.rs"
required-features = ["app"]

[features]
default = []
app = []

[dependencies]
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# GUI
# default-features pulls in the "wgpu" renderer, whose DX12 backend (wgpu-hal)
# depends on windows-core 0.62.x — conflicting with our own `windows = "0.56"`
# pin used throughout hid/sim/tray (two incompatible copies of the same trait
# in the dependency graph). We don't use accesskit/persistence, so stick to
# the glow (OpenGL) renderer instead, sidestepping the conflict entirely.
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["image"] }

# HID
hidapi = "2.6"

# DLL loader for SimConnect
libloading = "0.8"

# utils
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Win32 API
once_cell = "1.19"
widestring = "1.0"
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_Threading"
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.4"

[dev-dependencies]
mockall = "0.13"
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
