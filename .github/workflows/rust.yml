name: release-windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # Human-readable app name you show in the UI
      BIN_NAME: Aurora Vibra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --features app --locked

      - name: Prepare bundle (zip + checksums)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.event.repository.name }}"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Try to locate the exe produced by cargo:
          #   - dashed (cargo default from package name) e.g. "aurora-vibra.exe"
          #   - exact BIN_NAME (if you defined [[bin]] name with spaces)
          $binDashed = ($env:BIN_NAME -replace '[^\w\-]', '-').ToLower()
          $candidates = @(
            "target\release\$binDashed.exe",
            "target\release\$($env:BIN_NAME).exe",
            "target\release\aurora_vibra.exe"
          )

          $exePath = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $exePath = (Resolve-Path $c).Path; break }
          }
          if (-not $exePath) {
            $exe = Get-ChildItem "target\release\*.exe" | Select-Object -First 1
            if ($exe) { $exePath = $exe.FullName }
          }
          if (-not $exePath) {
            Write-Error "Could not find built .exe in target\release"
          }

          Write-Host "Found EXE: $exePath"

          # Zip name: <repo>-<tag>-windows-x64.zip (e.g. aurora-vibra-v3.0.0-windows-x64.zip)
          $zipName = "$repo-$tag-windows-x64.zip"
          $zipPath = Join-Path $dist $zipName

          # Bundle: the EXE (renamed inside zip to the nice BIN_NAME) plus the
          # license texts. MIT requires its notice to ship with every copy, and
          # THIRD-PARTY-NOTICES.md covers the embedded Microsoft SimConnect.dll.
          $tmpDir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "bundle") | Select-Object -ExpandProperty FullName
          Copy-Item $exePath (Join-Path $tmpDir "$($env:BIN_NAME).exe")
          Copy-Item "LICENSE" $tmpDir
          Copy-Item "THIRD-PARTY-NOTICES.md" $tmpDir
          Copy-Item "CHANGELOG.md" $tmpDir

          # README ссылается на assets/aurora-vibra-logo.png, которого в архиве
          # нет — офлайн это битая картинка в первой же строке. Вырезаем блок с
          # логотипом при копировании, остальной текст оставляем как есть.
          $readme = Get-Content "README.md" -Raw
          $readme = $readme -replace '(?m)^\s*<img src="assets/[^>]*>\s*\r?\n', ''
          Set-Content -Path (Join-Path $tmpDir "README.md") -Value $readme

          Compress-Archive -Path (Join-Path $tmpDir "*") -DestinationPath $zipPath -Force

          # Generate SHA256SUMS.txt for the zip
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          $sumLine = "$hash  $zipName"
          $sumFile = Join-Path $dist "SHA256SUMS.txt"
          Set-Content -Path $sumFile -Value $sumLine -NoNewline

          # Release notes: секция текущей версии из CHANGELOG.md + постоянный
          # хвост про проверку контрольной суммы и неподписанный бинарь.
          # Собираем здесь, потому что джоб release ниже репозиторий не чекаутит.
          $lines = Get-Content "CHANGELOG.md"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($tag))\s*$") { $start = $i + 1; break }
          }
          if ($start -lt 0) {
            Write-Error "CHANGELOG.md has no '## $tag' section - add it before tagging"
          }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+') { $end = $i; break }
          }
          $section = ($lines[$start..($end - 1)] -join "`n").Trim()

          # Собираем массивом, а не here-string: закрывающая "@ обязана стоять
          # в нулевой колонке, а внутри YAML-блока это разорвало бы сам блок.
          $fence = [string][char]0x60 * 3
          $tick = [char]0x60
          $notes = @(
            $section
            ''
            '---'
            ''
            '### Verify your download'
            ''
            ($fence + 'powershell')
            ('Get-FileHash -Algorithm SHA256 .\' + $zipName)
            $fence
            ''
            ('Expected: ' + $tick + $hash + $tick + ' (see also ' + $tick + 'SHA256SUMS.txt' + $tick + ' attached to this release).')
            ''
            '### Note on SmartScreen'
            ''
            'The executable is not code-signed, so Windows SmartScreen may warn on first run'
            '(**More info -> Run anyway**). Verify the checksum above if in doubt.'
          ) -join "`n"
          $notesFile = Join-Path $dist "RELEASE_NOTES.md"
          Set-Content -Path $notesFile -Value $notes

          Write-Host "Created: $zipPath"
          Write-Host "Checksums: $sumFile"
          Write-Host "Release notes: $notesFile"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist

      # Тег вида v4.2.0-rc1/-beta1 (наличие "-" после чисел, стандартный
      # semver pre-release) — такие сборки публикуются как GitHub prerelease
      # и НЕ становятся /releases/latest, иначе auto-updater (updater.rs,
      # LATEST_API бьёт именно в /releases/latest) тут же раздал бы RC всем
      # пользователям как стабильный релиз.
      - name: Detect pre-release tag
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # 1) Create or update a DRAFT release and upload assets
      - name: Create Draft Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Заметки собраны в джобе build из секции CHANGELOG.md под этот тег.
          body_path: dist/RELEASE_NOTES.md
          draft: true                 # <-- important: draft first
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt

      # 2) Publish the draft so it becomes visible. --latest только для
      # обычных релизов — pre-release не должен становиться /releases/latest
      # (см. комментарий у Detect pre-release tag выше).
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.value }}
        run: |
          set -euo pipefail
          # Ensure the draft exists, then publish it
          gh release view "$TAG" --repo "$REPO" >/dev/null
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
